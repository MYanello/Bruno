info:
  name: Get Oauth2 Provider
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/api/v3/providers/oauth2/?search={{provider_name}}"
  params:
    - name: search
      value: "{{provider_name}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
