info:
  name: Get Groups
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/api/v3/core/groups/?name={{identifier}}"
  params:
    - name: name
      value: "{{identifier}}"
      type: query
    - name: uuid
      value: "{{uuid}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
