info:
  name: Get Group Connection
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/api/v3/sources/group_connections/oauth/?group={{uuid}}"
  params:
    - name: group
      value: "{{uuid}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
