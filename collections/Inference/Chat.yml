info:
  name: Chat
  type: http
  seq: 2

http:
  method: POST
  url: "{{ENDPOINT}}/v1/chat/completions"
  body:
    type: json
    data: |-
      {
        "model": "{{MODEL}}",
        "messages": [
          {
            "role": "user",
            "content": "ping"
          }
        ],
        "max_tokens": 100
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
