opencollection: 1.0.0

info:
  name: Inference
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{API_KEY}}"
  variables:
    - name: MODEL
      value: pplx-decider-v1.2
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
