info:
  name: Create VPC
  type: http
  seq: 2

http:
  method: POST
  url: "{{ENDPOINT}}/v1beta1/networking/vpcs"
  body:
    type: json
    data: |-
      {
        "name": "myanello-vpc",
        "cidr": "10.0.0.0/16",
        "zone": "RNO2A"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
