info:
  name: Create Cluster
  type: http
  seq: 2

http:
  method: POST
  url: "{{ENDPOINT}}/v1beta1/cks/clusters"
  body:
    type: json
    data: |-
      {
        "name": "myanello-cluster",
        "zone": "RNO2A",
        "vpcId": "{{VPC_ID}}",
        "public": true,
        "version": "1.31",
        "network": {
          "podCidrName": "pod-cidr",
          "serviceCidrName": "service-cidr",
          "internalLbCidrNames": ["lb-cidr"]
        },
        "oidc": {
          "issuerUrl": "",
          "clientId": ""
        },
        "authzWebhook": {
          "server": ""
        },
        "authnWebhook": {
          "server": ""
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
