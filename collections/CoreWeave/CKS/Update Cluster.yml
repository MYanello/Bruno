info:
  name: Update Cluster
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{ENDPOINT}}/v1beta1/cks/clusters/{{CLUSTER_ID}}"
  body:
    type: json
    data: |-
      {
        "name": "myanello-cluster",
        "zone": "RNO2A",
        "vpcId": "{{VPC_ID}}",
        "public": true,
        "version": "1.31"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
