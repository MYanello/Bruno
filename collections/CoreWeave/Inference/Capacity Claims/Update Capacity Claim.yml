info:
  name: Update Capacity Claim
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{ENDPOINT}}/v1alpha1/inference/capacityclaims/{{CAPACITY_CLAIM_ID}}"
  body:
    type: json
    data: |-
      {
        "id": "{{CAPACITY_CLAIM_ID}}",
        "name": "myanello-capacity",
        "resources": {
          "instanceId": "nvidia-h100-80gb",
          "instanceCount": 1,
          "zones": ["RNO2A"]
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
