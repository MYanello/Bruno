info:
  name: Create Deployment
  type: http
  seq: 4

http:
  method: POST
  url: "{{ENDPOINT}}/v1alpha1/inference/deployments"
  body:
    type: json
    data: |-
      {
        "name": "pirate",
        "gatewayIds": [
          "{{GATEWAY_ID}}"
        ],
        "autoscaling": {
          "min": 1,
          "max": 1
        },
        "resources": {
          "instanceType": "gd-8xh100ib-i128",
          "gpuCount": 1
        },
        "traffic": {
          "weight": 100
        },
        "model": {
          "name": "qwen3.8-27b-pirate",
          "bucket": "myanello-fc",
          "path": "fine-tuned-models/qwen/3.8-27b-pirate/77/"
        },
        "runtime": {
          "engine": "dynamo-vllm",
          "version": "0.29.0+crwv.1",
          "engineConfig": {
            "max-model-len": "12000"
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
