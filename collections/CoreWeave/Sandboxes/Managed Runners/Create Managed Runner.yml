info:
  name: Create Managed Runner
  type: http
  seq: 3

http:
  method: POST
  url: "{{ENDPOINT}}/v1beta2/sandbox/managed-runners"
  body:
    type: json
    data: |-
      {
        "managed_spec": {
          "release_channel": "RELEASE_CHANNEL_STABLE"
        },
        "profile_bindings": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
