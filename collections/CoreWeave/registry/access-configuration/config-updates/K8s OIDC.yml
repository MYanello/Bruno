info:
  name: K8s OIDC
  type: http
  seq: 6

http:
  method: PUT
  url: "{{ENDPOINT}}/v1alpha1/registry/namespaces/{{NAMESPACE}}/accessConfiguration"
  body:
    type: json
    data: |-
      {
        "parent": "namespaces/{{NAMESPACE}}",
        "etag": "{{ETAG}}",
        "registryAccessConfiguration": {
          "name": "namespaces/{{NAMESPACE}}/accessConfiguration",
          "policySets": [
            {
              "id": "{{POLICY_SET_ID}}",
              "identitySelector": "REGISTRY_IDENTITY_SELECTOR_WORKLOAD_FEDERATION",
              "rules": [
                {
                  "id": "org-push",
                  "expression": "identity['issuer'] == 'https://token.actions.githubusercontent.com' && identity['claims']['repository_owner'] == '{{GITHUB_ORG}}' && request['type'] == 'repository' && request['action'] == 'push'"
                }
              ]
            }
          ]
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
