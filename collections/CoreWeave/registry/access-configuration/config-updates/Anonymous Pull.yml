info:
  name: Anonymous Pull
  type: http
  seq: 1

http:
  method: PUT
  url: "{{ENDPOINT}}/v1alpha1/registry/namespaces/{{NAMESPACE}}/accessConfiguration/policySets/main"
  body:
    type: json
    data: |-
      {
        "policySet": {
          "id": "main",
          "identitySelector": "REGISTRY_IDENTITY_SELECTOR_ANONYMOUS",
          "rules": [
            {
              "id": "public-pull",
              "expression": "identity['org_id'] == 'cw623e' && request['type'] == 'repository' && request['action'] == 'pull'"
            }
          ]
        },
        "etag": "{{ETAG}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
