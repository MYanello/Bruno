info:
  name: Public Specific Repository
  type: http
  seq: 2

http:
  method: PUT
  url: "{{ENDPOINT}}/v1alpha1/registry/namespaces/{{NAMESPACE}}/accessConfiguration"
  body:
    type: json
    data: |-
      {
        "parent": "namespaces/{{NAMESPACE}}",
        "etag": "{{ETAG}}",
        "registryAccessConfiguration": {
          "name": "namespaces/{{NAMESPACE}}/accessConfiguration",
          "policySets": [
            {
              "id": "anonymous-pull-my-image",
              "identitySelector": "REGISTRY_IDENTITY_SELECTOR_ANONYMOUS",
              "rules": [
                {
                  "id": "pull-my-image",
                  "expression": "request['type'] == 'repository' && request['action'] == 'pull' && request['repository'] == \"{{IMAGE}}"\""
                }
              ]
            }
          ]
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
