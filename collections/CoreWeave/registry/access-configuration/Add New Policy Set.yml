info:
  name: Add New Policy Set
  type: http
  seq: 7

http:
  method: PUT
  url: "{{ENDPOINT}}/v1alpha1/registry/namespaces/{{NAMESPACE}}/accessConfiguration/policySets/{{POLICY_SET_ID}}"
  body:
    type: json
    data: |-
      {
        "parent": "namespaces/{{NAMESPACE}}",
        "policySetId": "{{POLICY_SET_ID}}",
        "etag": "{{ETAG}}",
        "policySet": {
          "id": "{{POLICY_SET_ID}}",
          "identitySelector": "REGISTRY_IDENTITY_SELECTOR_WORKLOAD_FEDERATION",
          "rules": [
            {
              "id": "{{POLICY_SET_ID}}",
              "expression": "identity['issuer'] == 'https://oidc.cks.coreweave.com/id/3f393060-f8dd-4833-96b7-756e37c43223' && request['type'] == 'repository' && request['action'] == 'push'}}"
            }
          ]
        }
      }
  auth: inherit

runtime:
  variables:
    - name: POLICY_SET_ID
      value: github

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
