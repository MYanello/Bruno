info:
  name: Create Registry Namespace
  type: http
  seq: 3

http:
  method: POST
  url: "{{ENDPOINT}}/v1alpha1/registry/namespaces"
  body:
    type: json
    data: |-
      {
        "registryNamespaceId": "{{NAMESPACE}}",
        "registryNamespace": {
          "zone": "{{ZONE}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
