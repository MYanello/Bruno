info:
  name: List Registry Manifests
  type: http
  seq: 1

http:
  method: GET
  url: "{{ENDPOINT}}/v1alpha1/registry/namespaces/{{NAMESPACE}}/manifests"
  auth: inherit

query:
  includeUntagged: "{{INCLUDE_UNTAGGED}}"
  repository: "{{REPOSITORY}}"

headers:
  X-Remote-OrgUid: "{{ORG_UID}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
