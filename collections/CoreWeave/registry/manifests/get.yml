info:
  name: Get Registry Manifest By Tag
  type: http
  seq: 2

http:
  method: GET
  url: "{{ENDPOINT}}/v1alpha1/registry/namespaces/{{NAMESPACE}}/manifests:get"
  auth: inherit

query:
  repository: "{{REPOSITORY}}"
  tag: "{{TAG}}"

headers:
  X-Remote-OrgUid: "{{ORG_UID}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
