info:
  name: Set Bucket Settings
  type: http
  seq: 3

http:
  method: PUT
  url: "{{ENDPOINT}}/v1/cwobject/bucket/settings"
  body:
    type: json
    data: |-
      {
        "bucketName": "{{BUCKET_NAME}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
